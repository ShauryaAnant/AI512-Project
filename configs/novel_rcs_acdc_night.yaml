# Frequency-Aware Training for Rare Night Classes (Step 0 + Step 1 + Step 2)
# Step 0: Training-split-only class statistics & precomputed index
# Step 1: Rare-Class-Aware Crop Sampling (RCS, p=0.50, DAFormer-style)
# Step 2: Mild Class-Weighted CE (w_c proportional to 1/sqrt(f_c), clipped <= 5.0) + Soft-Dice
# Zero inference overhead: Exactly 26,975 parameters, 1.02 GFLOPs at 1080p

dataset:
  data_root: "dataset"
  splits_dir: "splits"
  crop_size: [512, 512]
  eval_size: [512, 1024]
  num_classes: 19
  ignore_index: 255

model:
  num_classes: 19
  input_channels: 3
  c_list: [8, 16, 24, 32, 48, 64]

training:
  # Locked protocol hyperparameters
  epochs: 300
  lr: 0.01
  min_lr: 0.000001
  weight_decay: 0.0001
  batch_size: 4
  num_workers: 2
  seed: 42
  clip_grad: 1.0
  amp: false
  out_dir: "runs/novel_rcs_seed42"

  # Step 1: Rare-Class-Aware Crop Sampling (RCS)
  rcs_enabled: true
  rcs_prob: 0.5
  rcs_stats_file: "data/processed/rcs_training_stats.json"

  # Step 2: Mild Class-Weighted Cross-Entropy + Soft-Dice Loss
  loss_type: "rcs"
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.0
