# Novelty 4: Illumination-Gated Skip Modulation (IG-Skip)
# Architecture: Mamba/SSM U-Net with CIE Luminance Prior Gating & Depthwise Edge Recovery
# Parameters: 28,137 (+1,162 params over baseline, 0.0281M total)
# FLOPs: 1.057 GFLOPs at 512x1024 (virtually zero overhead)
# Objective: Standard Combined Cross-Entropy (1.0) + Soft-Dice (1.0) to cleanly isolate architectural impact

dataset:
  data_root: "dataset"
  splits_dir: "splits"
  crop_size: [512, 512]
  eval_size: [512, 1024]
  num_classes: 19
  ignore_index: 255

model:
  architecture: "ig_skip"
  use_ig_skip: true
  num_classes: 19
  input_channels: 3
  c_list: [8, 16, 24, 32, 48, 64]

training:
  # Locked protocol hyperparameters
  epochs: 300
  lr: 0.01
  min_lr: 0.000001
  weight_decay: 0.0001
  batch_size: 4
  num_workers: 2
  seed: 42
  clip_grad: 1.0
  amp: false
  out_dir: "runs/novel_igskip_seed42"

  # Standard sampling & loss to isolate architectural novelty
  rcs_enabled: false
  loss_type: "baseline"
  ce_weight: 1.0
  dice_weight: 1.0
