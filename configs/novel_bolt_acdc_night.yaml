# Novel BOLT-Loss configuration for ACDC Night semantic segmentation
# Method: BOLT (Boundary-aware Online-hard-example Loss with Class-Rebalanced Tuning)
# Core Novelty: Class-Weighted Boundary Loss + Inverse-Frequency Rebalancing + OHEM
# Zero inference overhead: Exactly 26,975 parameters, 1.02 GFLOPs at 1080p

dataset:
  data_root: "dataset"
  splits_dir: "splits"
  crop_size: [512, 512]
  eval_size: [512, 1024]
  num_classes: 19
  ignore_index: 255

model:
  num_classes: 19
  input_channels: 3
  c_list: [8, 16, 24, 32, 48, 64]

training:
  # Locked protocol hyperparameters
  epochs: 300
  lr: 0.01
  min_lr: 0.000001
  weight_decay: 0.0001
  batch_size: 4
  num_workers: 2
  seed: 42
  clip_grad: 1.0
  amp: false
  out_dir: "runs/novel_bolt_seed42"

  # BOLT Novel Loss Formulation
  loss_type: "bolt"
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 1.0
  use_class_weights: true
  use_ohem: true
  ohem_ratio: 0.5
  min_kept: 10000
  use_boundary_loss: true
